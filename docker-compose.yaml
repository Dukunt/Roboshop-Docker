services:
 catalogue:
  build: ./catalogue 
  image: catalogue:1.0.0
  container_name: mycatalogue
  depends_on:
    - mongodb
 mongodb:
  build: ./mongodb
  image: joindevops/mongobd:1.0.0
  container_name: mymongo
 frontend:
  build: ./frontend
  image: frontend:1.0.0
  container_name: myfrontend
  ports:
   - "80:80"
  depends_on:
   - catalogue 


networks:
 default:
  driver: bridge
  name: robo
  external: false
     
  